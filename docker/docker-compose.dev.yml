services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ../server/src
          target: /app/src
        - action: rebuild
          path: ../server/package.json
        - action: rebuild
          path: ../server/package-lock.json
        - action: rebuild
          path: ../server/tsconfig.json

  client:
    build:
      target: development
    environment:
      VITE_PROXY_TARGET: http://api:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    develop:
      watch:
        - action: sync
          path: ../client/src
          target: /app/src
        - action: sync
          path: ../client/index.html
          target: /app/index.html
        - action: rebuild
          path: ../client/package.json
        - action: rebuild
          path: ../client/package-lock.json
        - action: rebuild
          path: ../client/vite.config.ts
